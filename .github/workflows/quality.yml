name: Phoenix Aether Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Syntax checks
        run: npm run lint:quick
      - name: Protocol and streaming checks
        run: |
          node tests/protocol.test.cjs
          node tests/streaming.test.cjs
          node tests/bundle.test.cjs
          node tests/author-metadata.cjs
